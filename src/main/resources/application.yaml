server:
  port: 8085
  error:
    include-message: always
#Configuracion de spring
spring:
  application:
    name: herramientas-matutino
  #Configuracion de migracion
  flyway:
    enabled: true
    baselineVersion: 1
    locations:
      classpath: db/migration
    sqlMigrationSuffixes: .sql
    baselineOnMigrate: true
    sqlMigrationPrefix: V
    schemas: public

  datasource:
    url: jdbc:postgresql://localhost:5432/HerramientasSem3-Product
    username: postgres
    password: postgres123
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true